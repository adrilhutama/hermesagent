<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Overview — KosHub OS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] } } } };</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="public/css/app.css" />
<script src="public/js/state.js"></script>
<script src="public/js/ai-client.js"></script>
<script src="public/js/components.js"></script>
</head>
<body data-page="app" class="bg-zinc-950 text-zinc-100 min-h-screen">
<div id="kh-drawer" class="hidden fixed inset-0 z-50">
  <div class="absolute inset-0 bg-black/70" onclick="KosUI.toggleDrawer(false)"></div>
  <div class="absolute left-0 top-0 bottom-0 w-72 bg-zinc-950 border-r border-zinc-800 p-4 overflow-y-auto">
    <div class="flex items-center justify-between mb-4">
      <p class="font-extrabold">KosHub <span class="text-sky-400">OS</span></p>
      <button onclick="KosUI.toggleDrawer(false)" class="p-2 rounded-lg border border-zinc-800"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <nav class="space-y-1.5"></nav>
  </div>
</div>
<aside id="kh-sidebar" class="hidden lg:block fixed left-0 top-0 bottom-0 w-64 border-r border-zinc-800 bg-zinc-950 p-4 overflow-y-auto"></aside>
<div class="lg:pl-64">
  <header id="kh-topbar" class="sticky top-0 z-40 backdrop-blur bg-zinc-950/85 border-b border-zinc-800 px-4 py-3 flex items-center gap-3"></header>
  <main class="px-4 py-5 max-w-5xl mx-auto pb-20">
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
      <div class="card p-5">
        <p class="text-[11px] font-bold uppercase tracking-wide text-zinc-500 flex items-center gap-1.5"><i data-lucide="banknote" class="w-4 h-4 text-emerald-400"></i>Total Kas Bulan Ini</p>
        <p id="kpiKas" class="text-2xl font-extrabold mt-2 text-emerald-400">Rp0</p>
        <p id="kpiKasSub" class="text-xs text-zinc-500 mt-1">—</p>
      </div>
      <div class="card p-5">
        <p class="text-[11px] font-bold uppercase tracking-wide text-zinc-500 flex items-center gap-1.5"><i data-lucide="alert-triangle" class="w-4 h-4 text-amber-400"></i>Item Dapur Kritis</p>
        <p id="kpiKritis" class="text-2xl font-extrabold mt-2 text-amber-400">0</p>
        <p id="kpiKritisSub" class="text-xs text-zinc-500 mt-1">—</p>
      </div>
      <div class="card p-5">
        <p class="text-[11px] font-bold uppercase tracking-wide text-zinc-500 flex items-center gap-1.5"><i data-lucide="clipboard-list" class="w-4 h-4 text-sky-400"></i>Piket Hari Ini</p>
        <p id="kpiPiket" class="text-2xl font-extrabold mt-2">—</p>
        <p id="kpiPiketSub" class="text-xs text-zinc-500 mt-1">—</p>
      </div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-5 gap-3 mt-3">
      <div class="card p-5 lg:col-span-3">
        <h3 class="font-bold text-sm flex items-center gap-2"><i data-lucide="activity" class="w-4 h-4 text-sky-400"></i>Aktivitas Terkini</h3>
        <div id="activityList" class="mt-3 space-y-2"></div>
      </div>
      <div class="card p-5 lg:col-span-2">
        <h3 class="font-bold text-sm flex items-center gap-2"><i data-lucide="zap" class="w-4 h-4 text-emerald-400"></i>Quick Actions</h3>
        <div class="grid gap-2 mt-3">
          <button onclick="KosUI.openSpotlight()" class="w-full px-4 py-3 rounded-xl bg-sky-500 hover:bg-sky-400 text-zinc-950 font-bold text-sm flex items-center justify-center gap-2"><i data-lucide="sparkles" class="w-4 h-4"></i>Catat via AI <kbd class="text-[10px] bg-zinc-950/20 rounded px-1.5 py-0.5 font-mono">Ctrl K</kbd></button>
          <a href="/finance" class="w-full px-4 py-3 rounded-xl border border-zinc-700 bg-zinc-900 hover:border-emerald-400 font-bold text-sm flex items-center justify-center gap-2"><i data-lucide="plus-circle" class="w-4 h-4 text-emerald-400"></i>Tambah Pengeluaran</a>
          <a href="/inventory" class="w-full px-4 py-3 rounded-xl border border-zinc-700 bg-zinc-900 hover:border-amber-400 font-bold text-sm flex items-center justify-center gap-2"><i data-lucide="refrigerator" class="w-4 h-4 text-amber-400"></i>Cek Stok Dapur</a>
          <a href="/schedule" class="w-full px-4 py-3 rounded-xl border border-zinc-700 bg-zinc-900 hover:border-sky-500 font-bold text-sm flex items-center justify-center gap-2"><i data-lucide="calendar-check" class="w-4 h-4 text-sky-400"></i>Lihat Piket</a>
        </div>
        <h3 class="font-bold text-sm mt-5 flex items-center gap-2"><i data-lucide="clipboard-list" class="w-4 h-4 text-zinc-400"></i>Piket Belum Selesai</h3>
        <div id="chorePreview" class="mt-2 space-y-2"></div>
      </div>
    </div>
  </main>
</div>
<script>
KosUI.setTitle('Overview Workspace');
function render() {
  var K = KosHub, s = K.store();
  document.getElementById('kpiKas').textContent = K.fmtRp(K.monthTotal());
  document.getElementById('kpiKasSub').textContent = K.monthExpenses().length + ' transaksi bulan ini';
  var k = K.critics();
  document.getElementById('kpiKritis').textContent = k.length;
  document.getElementById('kpiKritisSub').textContent = k.length ? k.map(function (i) { return i.name; }).slice(0, 3).join(', ') : 'semua aman ✓';
  var open = s.chores.filter(function (c) { return !c.done; });
  document.getElementById('kpiPiket').textContent = K.todayID();
  document.getElementById('kpiPiketSub').textContent = open.length ? open.length + ' tugas belum selesai' : 'semua beres ✓';
  var kindIcon = { expense: 'receipt', inventory: 'refrigerator', chore: 'calendar-check', system: 'info' };
  document.getElementById('activityList').innerHTML = s.activity.slice(0, 8).map(function (a) {
    return '<div class="flex items-center gap-3 p-3 rounded-xl border border-zinc-800 bg-zinc-950">' +
      '<i data-lucide="' + (kindIcon[a.kind] || 'dot') + '" class="w-4 h-4 text-zinc-500 shrink-0"></i>' +
      '<p class="flex-1 text-sm min-w-0 truncate">' + K.esc(a.text) + '</p>' +
      '<span class="text-[11px] text-zinc-600 shrink-0">' + new Date(a.at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }) + '</span></div>';
  }).join('') || '<p class="text-sm text-zinc-500">Belum ada aktivitas.</p>';
  document.getElementById('chorePreview').innerHTML = open.slice(0, 4).map(function (c) {
    return '<label class="flex items-center gap-2.5 p-2.5 rounded-xl border border-zinc-800 bg-zinc-950 cursor-pointer text-sm">' +
      '<input type="checkbox" onchange="KosHub.toggleChore(\'' + c.id + '\')" class="w-4 h-4 accent-emerald-400" />' +
      '<span class="flex-1 min-w-0 truncate">' + K.esc(c.task) + '</span></label>';
  }).join('') || '<p class="text-xs text-zinc-500">Semua tugas beres ✓</p>';
  KosUI.icons();
}
document.addEventListener('DOMContentLoaded', render);
KosHub.onChange(render);
</script>
</body>
</html>
